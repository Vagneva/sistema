<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feras Taekwondo 🥋 - Lista de Presença</title>
    
   <!-- Scripts Oficiais e Estáveis do Firebase (Substitua no topo do seu HTML) -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    
    <!-- Efeito de confete para o Aniversário dos Feras -->
    <script src="https://jsdelivr.net"></script>

    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background: #1a1a1a; color: white; padding: 20px; }
        .caixa { background: #2a2a2a; padding: 30px; border-radius: 15px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 2px solid #d4af37; }
        h1 { color: #ffcc00; margin-bottom: 5px; }
        button { background: #27ae60; color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 15px; width: 100%; }
        button:hover { background: #219150; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #555; background: #333; color: white; box-sizing: border-box; }
        .festejo { display: none; background: #8e44ad; padding: 20px; border-radius: 10px; border: 3px dashed #fff; margin-bottom: 20px; font-size: 20px; animation: tremer 0.5s infinite; }
        @keyframes tremer { 0% { transform: translate(1px, 1px) rotate(0deg); } 50% { transform: translate(-1px, -2px) rotate(-1deg); } 100% { transform: translate(1px, 1px) rotate(0deg); } }
    </style>
</head>
<body>

    <!-- Banner de Aniversário Secreto -->
    <div id="caixaAniversario" class="festejo">
        🎉🥋 PARABÉNS, FERA <span id="nomeAniversariante"></span>! OSS! 🥋🎉<br>
        A equipe Feras Taekwondo te deseja um feliz aniversário cheio de garra!
    </div>

    <div class="caixa">
        <h1>Feras Taekwondo 🥋</h1>
        <p>Insira o ID ou Nome do Aluno para registrar a presença de hoje</p>
        
        <input type="text" id="idAluno" placeholder="Digite o ID do Aluno ou Nome Completo">
        <button onclick="marcarPresenca()">CONFIRMAR PRESENÇA (OSS!)</button>
    </div>

    <script>
       // CONFIGURAÇÃO DO SEU BANCO DE DADOS
        var firebaseConfig = {
            databaseURL: "https://academia-2d8b2-default-rtdb.firebaseio.com"
        };

        // Inicializando o Firebase de forma independente
        firebase.initializeApp(firebaseConfig);
        var database = firebase.database();

        function marcarPresenca() {
            const campoId = document.getElementById('idAluno').value.trim();
            if (!campoId) {
                alert("Por favor, digite o nome ou ID do aluno.");
                return;
            }

            // Criando a estrutura de datas do ano inteiro para ficar gravado organizado
            const hoje = new Date();
            const ano = hoje.getFullYear();
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const dia = String(hoje.getDate()).padStart(2, '0');
            const hora = hoje.toLocaleTimeString('pt-BR');

            // Primeiro buscamos o cadastro do aluno no Firebase para descobrir a data de nascimento dele
            database.ref('alunos/' + campoId).once('value').then((snapshot) => {
                let dataNascimento = "";
                let nomeCompleto = campoId;

                if (snapshot.exists()) {
                    const dadosAluno = snapshot.val();
                    nomeCompleto = dadosAluno.nomeCompleto || campoId;
                    dataNascimento = dadosAluno.dataNascimento || ""; // Formato esperado do cadastro: AAAA-MM-DD ou DD/MM/AAAA
                }

                // Salva a presença na folha de chamadas independente (Ano -> Mês -> Dia)
                database.ref(`presencas/${ano}/${mes}/${dia}/${campoId}`).set({
                    nome: nomeCompleto,
                    horario: hora
                }).then(() => {
                    
                    // Verifica se o aluno cadastrado está fazendo aniversário hoje
                    if (dataNascimento) {
                        verificarAniversarioDoFera(nomeCompleto, dataNascimento);
                    } else {
                        alert(`🥋 Presença Confirmada!\nOSS, ${nomeCompleto}!`);
                        document.getElementById('idAluno').value = "";
                    }
                    
                });
            }).catch((erro) => {
                alert("Erro ao conectar com o Firebase. Verifique seu link.");
                console.error(erro);
            });
        }

        function verificarAniversarioDoFera(nome, dataNasc) {
            const hoje = new Date();
            const diaHoje = String(hoje.getDate()).padStart(2, '0');
            const mesHoje = String(hoje.getMonth() + 1).padStart(2, '0');

            let diaNascAluno = "";
            let mesNascAluno = "";

            // Ajusta a leitura caso a data esteja com traço (2015-09-24) ou barra (24/09/2015)
            if (dataNasc.includes('-')) {
                const partes = dataNasc.split('-');
                diaNascAluno = partes[2];
                mesNascAluno = partes[1];
            } else if (dataNasc.includes('/')) {
                const partes = dataNasc.split('/');
                diaNascAluno = partes[0];
                mesNascAluno = partes[1];
            }

            // Se o dia e o mês baterem com o dia de hoje: Ativa a Festa!
            if (diaHoje === diaNascAluno && mesHoje === mesNascAluno) {
                document.getElementById('nomeAniversariante').innerText = nome;
                document.getElementById('caixaAniversario').style.display = 'block';

                // Chuva de confetes no navegador do celular/tablet/PC
                confetti({ particleCount: 200, spread: 90, origin: { y: 0.6 } });

                // Limpa o campo de texto
                document.getElementById('idAluno').value = "";

                // Esconde o aviso de festa depois de 12 segundos para a próxima chamada
                setTimeout(() => {
                    document.getElementById('caixaAniversario').style.display = 'none';
                }, 12000);
            } else {
                alert(`🥋 Presença Confirmada!\nOSS, ${nome}!`);
                document.getElementById('idAluno').value = "";
            }
        }
    </script>
</body>
</html>
