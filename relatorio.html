<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Presenças - Feras Taekwondo</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        h1 { color: #3b82f6; text-align: center; margin-bottom: 20px; }
        .filtros { display: flex; gap: 15px; margin-bottom: 25px; background: #0f172a; padding: 15px; border-radius: 8px; justify-content: center; }
        button { padding: 10px 20px; border-radius: 6px; border: none; background: #3b82f6; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; max-width: 300px; }
        button:hover { background: #2563eb; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #0f172a; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #1e293b; }
        th { background: #3b82f6; color: white; }
        tr:hover { background: #1e293b; }
        .vazio { text-align: center; color: #64748b; padding: 30px; font-style: italic; }
    </style>
</head>
<body>
<div class="container">
    <h1 style="text-align: center; color: #3b82f6; margin-bottom: 5px;">Feras Taekwondo</h1>
    <h1>📊 Histórico Geral de Presenças</h1>
    
    <div class="filtros">
        <button onclick="puxarRelatorioNuvem()">Atualizar Histórico Geral 🔄</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Data e Horário</th>
                <th>Nome do Aluno</th>
                <th style="color: #60a5fa; text-align: center;">Total de Treinos (Ano)</th>
            </tr>
        </thead>
        <tbody id="tabela-corpo">
            <tr>
                <td colspan="3" class="vazio">Clique no botão acima para carregar as presenças...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    const urlNuvemBase = “https://academia-2d8b2-default-rtdb.firebaseio.com/”;
    function puxarRelatorioNuvem() {
        const corpoTabela = document.getElementById('tabela-corpo');
        corpoTabela.innerHTML = '<tr><td colspan="3" class="vazio">Carregando dados da nuvem...</td></tr>';

        fetch(`${urlNuvemBase}/presencas.json`)
            .then(res => res.json())
            .then(dados => {
                corpoTabela.innerHTML = "";
                if (!dados) {
                    corpoTabela.innerHTML = '<tr><td colspan="3" class="vazio">⚠ Nenhuma presença registrada no banco de dados.</td></tr>';
                    return;
                }

                let linhasHTML = "";
                let contagemAlunos = {};
                let listaPresencas = [];

                // 1º Passo: Conta as presenças acumuladas nas chaves automáticas do seu Firebase
                Object.keys(dados).forEach(idAutomatico => {
                    let registro = dados[idAutomatico];
                    if (registro && registro.nome) {
                        let nomeLimpo = registro.nome.trim();
                        
                        if (!contagemAlunos[nomeLimpo]) {
                            contagemAlunos[nomeLimpo] = 0;
                        }
                        contagemAlunos[nomeLimpo]++;

                        listaPresencas.push({
                            dataHora: registro.dataHora || 'Data indisponível',
                            nome: nomeLimpo
                        });
                    }
                });

                // Inverte para exibir a marcação mais recente sempre no topo
                listaPresencas.reverse();

                // 2º Passo: Desenha as linhas na tela com o selo azul de treinos totais
                listaPresencas.forEach(item => {
                    let totalTreinos = contagemAlunos[item.item || item.nome] || 0;
                    linhasHTML += `<tr>
                        <td><b>${item.dataHora}</b></td>
                        <td style="color: #10b981; font-weight: bold;">✓ ${item.nome}</td>
                        <td style="text-align: center;"><span style="color: #1e3a8a; font-weight: bold; background: #e0f2fe; padding: 4px 10px; border-radius: 6px; display: inline-block;">${totalTreinos} treinos</span></td>
                    </tr>`;
                });

                corpoTabela.innerHTML = linhasHTML;
            })
            .catch(() => {
                corpoTabela.innerHTML = '<tr><td colspan="3" class="vazio" style="color:#ef4444;">⚠ Erro ao conectar com o banco de dados.</td></tr>';
            });
    }
</script>
</body>
</html>
