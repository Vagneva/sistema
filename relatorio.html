<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Presenças - Feras Taekwondo</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        h1 { color: #3b82f6; text-align: center; margin-bottom: 20px; }
        .filtros { display: flex; gap: 15px; margin-bottom: 25px; background: #0f172a; padding: 15px; border-radius: 8px; justify-content: center; }
        select, button { padding: 10px 15px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; }
        button { background: #3b82f6; border: none; }
        button:hover { background: #2563eb; }
        
        /* Estilo do novo painel de contagem para o brinde */
        .painel-ranking { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 25px; border-left: 5px solid #10b981; display: none; }
        .painel-ranking h3 { margin: 0 0 10px 0; color: #10b981; font-size: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
        .grid-ranking { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
        .item-ranking { background: #1e293b; padding: 8px 12px; border-radius: 6px; font-size: 14px; display: flex; justify-content: space-between; border: 1px solid #334155; }
        .item-ranking span { font-weight: bold; color: #3b82f6; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #0f172a; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #1e293b; }
        th { background: #3b82f6; color: white; }
        tr:hover { background: #1e293b; }
        .vazio { text-align: center; color: #64748b; padding: 30px; font-style: italic; }
    </style>
</head>
<body>
<div class="container">
    <h1>📊 Histórico de Presenças (Jan-Dez)</h1>
    <div class="filtros">
        <select id="filtro-ano"><option value="2026">2026</option><option value="2027">2027</option></select>
        <select id="filtro-mes">
            <option value="janeiro">Janeiro</option><option value="fevereiro">Fevereiro</option><option value="março">Março</option>
            <option value="abril">Abril</option><option value="maio">Maio</option><option value="junho">Junho</option>
            <option value="julho">Julho</option><option value="agosto">Agosto</option><option value="setembro">Setembro</option>
            <option value="outubro">Outubro</option><option value="novembro">Novembro</option><option value="dezembro">Dezembro</option>
        </select>
        <button onclick="puxarRelatorioNuvem()">Buscar Registros 🔍</button>
    </div>

    <!-- NOVO CONTENEDOR VISUAL DO RANKING DE AULAS -->
    <div id="painel-ranking" class="painel-ranking">
        <h3>🏆 Ranking de Presenças (Total de Aulas)</h3>
        <div id="grid-ranking" class="grid-ranking"></div>
    </div>

    <table>
        <thead><tr><th>Data</th><th>Horário</th><th>Nome do Aluno</th></tr></thead>
        <tbody id="tabela-corpo"><tr><td colspan="3" class="vazio">Escolha o mês e clique em Buscar...</td></tr></tbody>
    </table>
</div>
<script>
    const urlNuvemBase = "https://academia-2d8b2-default-rtdb.firebaseio.com/";

    function puxarRelatorioNuvem() {
        const ano = document.getElementById('filtro-ano').value;
        const mes = document.getElementById('filtro-mes').value;
        const corpoTable = document.getElementById('tabela-corpo');
        const painelRanking = document.getElementById('painel-ranking');
        const gridRanking = document.getElementById('grid-ranking');
        
        // Reseta as telas antes de carregar
        corpoTable.innerHTML = '<tr><td colspan="3" class="vazio">🔄 Carregando dados da nuvem...</td></tr>';
        painelRanking.style.display = "none";
        gridRanking.innerHTML = "";

        fetch(`${urlNuvemBase}/presencas/${ano}/${mes}.json`)
            .then(res => res.json())
            .then(dados => {
                corpoTable.innerHTML = "";
                
                if (!dados) {
                    corpoTable.innerHTML = '<tr><td colspan="3" class="vazio">❌ Nenhuma presença registrada neste mês.</td></tr>';
                    return;
                }

                let linhasHTML = "";
                let dicionarioContagem = {}; // Objeto temporário para somar as aulas

                // Varre os dias salvos no mês
                Object.keys(dados).forEach(dia => {
                    let cpfsDoDia = dados[dia];
                    
                    // Varre os alunos que entraram naquele dia
                    Object.keys(cpfsDoDia).forEach(cpf => {
                        let registro = cpfsDoDia[cpf];
                        
                        // Monta as linhas tradicionais da tabela
                        linhasHTML += `<tr> 
                            <td><b>${dia}</b> de ${mes}</td> 
                            <td>${registro.horario}</td> 
                            <td style="color: #10b981;">✓ ${registro.nome}</td> 
                        </tr>`;

                        // LÓGICA DO BRINDE: Conta +1 aula para o aluno no dicionário
                        let nomeFormatado = registro.nome.trim();
                        dicionarioContagem[nomeFormatado] = (dicionarioContagem[nomeFormatado] || 0) + 1;
                    });
                });

                // Renderiza as linhas na tabela
                corpoTable.innerHTML = linhasHTML;

                // CONSTRUÇÃO DO PAINEL DO RANKING DE BRINDES
                let listaOrdenada = Object.entries(dicionarioContagem).sort((a, b) => b[1] - a[1]);
                
                if (listaOrdenada.length > 0) {
                    let rankingHTML = "";
                    listaOrdenada.forEach(item => {
                        let nomeAluno = item[0];
                        let totalAulas = item[1];
                        rankingHTML += `
                            <div class="item-ranking">
                                👤 ${nomeAluno} <span>${totalAulas} ${totalAulas === 1 ? 'aula' : 'aulas'}</span>
                            </div>`;
                    });
                    gridRanking.innerHTML = rankingHTML;
                    painelRanking.style.display = "block"; // Torna o painel visível na tela
                }
            })
            .catch((error) => {
                console.error(error);
                corpoTable.innerHTML = '<tr><td colspan="3" class="vazio" style="color:#ef4444;">⚠ Erro ao conectar com o banco de dados.</td></tr>';
            });
    }
</script>
</body>
</html>
