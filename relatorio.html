<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Presenças - Feras Taekwondo</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        h1 { color: #3b82f6; text-align: center; margin-bottom: 20px; }
        .filtros { display: flex; gap: 15px; margin-bottom: 25px; background: #0f172a; padding: 15px; border-radius: 8px; justify-content: center; }
        select, button { padding: 10px 15px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; }
        button { background: #3b82f6; border: none; }
        button:hover { background: #2563eb; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #0f172a; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #1e293b; }
        th { background: #3b82f6; color: white; }
        tr:hover { background: #1e293b; }
        .vazio { text-align: center; color: #64748b; padding: 30px; font-style: italic; }
    </style>
</head>
<body>
<div class="container">
    <h1 style="text-align: center; color: #3b82f6; margin-bottom: 5px;">Feras Taekwondo</h1>
    <h1>📊 Histórico de Presenças (Jan-Dez)</h1>
    <div class="filtros">
        <select id="filtro-ano"><option value="2026">2026</option><option value="2027">2027</option></select>
        <select id="filtro-mes">
            <option value="janeiro">Janeiro</option><option value="fevereiro">Fevereiro</option><option value="março">Março</option>
            <option value="abril">Abril</option><option value="maio">Maio</option><option value="junho">Junho</option>
            <option value="julho">Julho</option><option value="agosto">Agosto</option><option value="setembro">Setembro</option>
            <option value="outubro">Outubro</option><option value="novembro">Novembro</option><option value="dezembro">Dezembro</option>
        </select>
        <button onclick="puxarRelatorioNuvem()">Buscar Registros 🔍</button>
    </div>
     </div>

    <h1 style="text-align: center; color: #3b82f6; margin-bottom: 15px;">Feras Taekwondo</h1>

    <table>
        <thead>
            <tr>
                <th>Data</th>
                <th>Horário</th>
                <th>Nome do Aluno</th>
                <th style="color: #3b82f6; text-align: center;">Total de Treinos</th>
            </tr>
        </thead>
        <tbody id="tabela-corpo">
            <tr>
                <td colspan="4" class="vazio">Escolha o mês e clique em Buscar...</td>
            </tr>
        </tbody>
    </table>
</div>
<script>
    const urlNuvemBase = "https://academia-2d8b2-default-rtdb.firebaseio.com/";

   function puxarRelatorioNuvem() {
    const ano = document.getElementById('filtro-ano').value;
    const mes = document.getElementById('filtro-mes').value;
    const corpoTabela = document.getElementById('tabela-corpo');

    corpoTabela.innerHTML = '<tr><td colspan="4" class="vazio">Carregando dados da nuvem...</td></tr>';

    fetch(`${urlNuvembase}/presencas/${ano}/${mes}.json`)
        .then(res => res.json())
        .then(dados => {
            corpoTabela.innerHTML = "";
            if (!dados) {
                corpoTabela.innerHTML = '<tr><td colspan="4" class="vazio">⚠ Nenhuma presença registrada neste mês.</td></tr>';
                return;
            }

            let linhasHTML = "";
            let contagemAlunos = {};

            // Primeiro passo: Contar as presenças de cada aluno no mês
            Object.keys(dados).forEach(dia => {
                let cpfsDoDia = dados[dia];
                Object.keys(cpfsDoDia).forEach(cpf => {
                    let registro = cpfsDoDia[cpf];
                    if (registro && registro.nome) {
                        if (!contagemAlunos[registro.nome]) {
                            contagemAlunos[registro.nome] = 0;
                        }
                        contagemAlunos[registro.nome]++;
                    }
                });
            });

            // Segundo passo: Montar as linhas da tabela com a nova coluna
            Object.keys(dados).forEach(dia => {
                let cpfsDoDia = dados[dia];
                Object.keys(cpfsDoDia).forEach(cpf => {
                    let registro = cpfsDoDia[cpf];
                    let totalTreinos = contagemAlunos[registro.nome] || 0;

                    linhasHTML += `<tr>
                        <td><b>${dia}</b> de ${mes}</td>
                        <td>${registro.horario}</td>
                        <td style="color: #10b981; font-weight: bold;">✓ ${registro.nome}</td>
                        <td style="color: #1e3a8a; font-weight: bold; background: #e0f2fe; text-align: center; border-radius: 4px;">${totalTreinos} treinos</td>
                    </tr>\;
                });
            });

            corpoTabela.innerHTML = linhasHTML;
        })
        .catch(() => {
            corpoTabela.innerHTML = '<tr><td colspan="4" class="vazio" style="color:#ef4444;">⚠ Erro ao conectar com o banco de dados.</td></tr>';
        });
}
</script>
</body>
</html>
