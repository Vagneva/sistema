<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Presenças - Feras Taekwondo</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 850px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        
      <!-- TÍTULO CORRIGIDO: LETRAS AZUIS COM CONTORNO VERMELHO -->
    <h1 style="text-align: center; margin-bottom: 20px; font-size: 32px; letter-spacing: 1px;">
        <span style="color: #3b82f6 !important; font-weight: 900; -webkit-text-stroke: 1.5px #ef4444; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">FERAS TAEKWONDO</span>
        <span style="color: #ffffff; font-size: 22px; display: block; margin-top: 8px; font-weight: normal;">📊 Histórico de Presenças Coletivas</span>
    </h1>

        .filtros { display: flex; gap: 15px; margin-bottom: 25px; background: #0f172a; padding: 15px; border-radius: 8px; justify-content: center; }
        
        /* Botões e Seletores com as cores do Dojô */
        select { padding: 10px 15px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; }
        button.btn-buscar { padding: 10px 20px; border-radius: 6px; background: #ef4444; color: white; font-size: 15px; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
        button.btn-buscar:hover { background: #dc2626; }
        
        /* Mantido o amarelo de destaque para o prêmio dos alunos */
        .painel-ranking { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 25px; border-left: 5px solid #ffb300; display: none; }
        .painel-ranking h3 { margin: 0 0 10px 0; color: #ffb300; font-size: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
        .grid-ranking { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
        .item-ranking { background: #1e293b; padding: 8px 12px; border-radius: 6px; font-size: 14px; display: flex; justify-content: space-between; border: 1px solid #334155; }
        .item-ranking span { font-weight: bold; color: #ffb300; }

        /* Tabela com cabeçalho azul oficial */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #0f172a; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #1e293b; }
        th { background: #3b82f6; color: white; }
        tr:hover { background: #1e293b; }
        .vazio { text-align: center; color: #64748b; padding: 30px; font-style: italic; }

        .btn-excluir { background: #ef4444; color: white; border: none; padding: 5px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-excluir:hover { background: #b91c1c; }
        .col-acao { text-align: right; }
    </style>
</head>
<body>
<div class="container">
    
    <!-- TÍTULO ATUALIZADO COM AS CORES TRADICIONAIS DO TAEKWONDO -->
    <h1>
        <span class="txt-vermelho">FERAS</span> 
        <span class="txt-azul">TAEKWONDO</span> 
        <span class="txt-branco">📊 Histórico de Presenças Coletivas</span>
    </h1>

    <div class="filtros">
        <select id="filtro-ano"><option value="2026">2026</option><option value="2027">2027</option></select>
        <select id="filtro-mes">
            <option value="ano_todo">⭐ O Ano Todo (Acumulado)</option>
            <option value="janeiro">Janeiro</option><option value="fevereiro">Fevereiro</option><option value="março">Março</option>
            <option value="abril">Abril</option><option value="maio">Maio</option><option value="junho">Junho</option>
            <option value="julho">Julho</option><option value="agosto">Agosto</option><option value="setembro">Setembro</option>
            <option value="outubro">Outubro</option><option value="novembro">Novembro</option><option value="dezembro">Dezembro</option>
        </select>
        <button class="btn-buscar" onclick="puxarRelatorioNuvem()">Buscar Registros 🔍</button>
    </div>

    <div id="painel-ranking" class="painel-ranking">
        <h3>🏆 Ranking de Presenças (Total de Aulas)</h3>
        <div id="grid-ranking" class="grid-ranking"></div>
    </div>

    <table>
        <thead><tr><th>Data</th><th>Horário</th><th>Nome do Aluno</th><th class="col-acao">Ação</th></tr></thead>
        <tbody id="tabela-corpo"><tr><td colspan="4" class="vazio">Escolha o mês e clique em Buscar...</td></tr></tbody>
    </table>
</div>
<script>
    const urlNuvemBase = "https://academia-2d8b2-default-rtdb.firebaseio.com/";
    // Lista completa usada para fazer a varredura anual em lote se necessário
    const TODOS_MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];

    function puxarRelatorioNuvem() {
        const ano = document.getElementById('filtro-ano').value;
        const mesSelecionado = document.getElementById('filtro-mes').value;
        const corpoTable = document.getElementById('tabela-corpo');
        const painelRanking = document.getElementById('painel-ranking');
        const gridRanking = document.getElementById('grid-ranking');
        
        corpoTable.innerHTML = '<tr><td colspan="4" class="vazio">🔄 Carregando dados da nuvem...</td></tr>';
        painelRanking.style.display = "none";
        gridRanking.innerHTML = "";

        let dicionarioContagem = {};
        let linhasHTML = "";

        // FUNÇÃO INTERNA: Processa os dados brutos de um mês e soma no ranking
        function processarMes(dadosMes, nomeMes) {
            if (!dadosMes) return;
            Object.keys(dadosMes).forEach(dia => {
                let cpfsDoDia = dadosMes[dia];
                Object.keys(cpfsDoDia).forEach(idAluno => {
                    let registro = cpfsDoDia[idAluno];
                    
                    linhasHTML += `<tr> 
                        <td><b>${dia}</b> de ${nomeMes}</td> 
                        <td>${registro.horario}</td> 
                        <td style="color: #10b981;">✓ ${registro.nome}</td>
                        <td class="col-acao">
                            <button class="btn-excluir" onclick="removerPresencaNuvem('${ano}', '${nomeMes}', '${dia}', '${idAluno}', '${registro.nome}')">🗑️ Excluir</button>
                        </td>
                    </tr>`;

                    let nomeFormatado = registro.nome.trim();
                    dicionarioContagem[nomeFormatado] = (dicionarioContagem[nomeFormatado] || 0) + 1;
                });
            });
        }

        // FUNÇÃO INTERNA: Renderiza o ranking na parte de cima da tela
        function finalizarInterface() {
            corpoTable.innerHTML = linhasHTML || '<tr><td colspan="4" class="vazio">❌ Nenhuma presença registrada no período selecionado.</td></tr>';
            
            let listaOrdenada = Object.entries(dicionarioContagem).sort((a, b) => b[1] - a[1]);
            if (listaOrdenada.length > 0) {
                let rankingHTML = "";
                listaOrdenada.forEach(item => {
                    rankingHTML += `
                        <div class="item-ranking">
                            👤 ${item[0]} <span>${item[1]} ${item[1] === 1 ? 'aula' : 'aulas'}</span>
                        </div>`;
                });
                gridRanking.innerHTML = rankingHTML;
                painelRanking.style.display = "block";
            }
        }

        // LÓGICA DE DECISÃO: Busca anual em lote ou busca mensal normal
        if (mesSelecionado === "ano_todo") {
            // Executa buscas paralelas para os 12 meses no seu Firebase
            let promessas = TODOS_MESES.map(m => 
                fetch(`${urlNuvemBase}/presencas/${ano}/${m}.json`).then(res => res.json())
            );

            Promise.all(promessas)
                .then(resultados => {
                    resultados.forEach((dadosMes, index) => {
                        processarMes(dadosMes, TODOS_MESES[index]);
                    });
                    finalizarInterface();
                })
                .catch(err => {
                    console.error(err);
                    corpoTable.innerHTML = '<tr><td colspan="4" class="vazio" style="color:#ef4444;">⚠ Erro ao consolidar o relatório anual.</td></tr>';
                });
        } else {
            // Busca padrão de um único mês (Lógica original)
            fetch(`${urlNuvemBase}/presencas/${ano}/${mesSelecionado}.json`)
                .then(res => res.json())
                .then(dados => {
                    processarMes(dados, mesSelecionado);
                    finalizarInterface();
                })
                .catch(err => {
                    console.error(err);
                    corpoTable.innerHTML = '<tr><td colspan="4" class="vazio" style="color:#ef4444;">⚠ Erro ao conectar com o banco de dados.</td></tr>';
                });
        }
    }

    function removerPresencaNuvem(ano, mes, dia, idAluno, nomeAluno) {
        if (confirm(`⚠️ Tem certeza de que deseja apagar a presença de "${nomeAluno}" no dia ${dia} de ${mes}?`)) {
            fetch(`${urlNuvemBase}/presencas/${ano}/${mes}/${dia}/${idAluno}.json`, {
                method: 'DELETE'
            })
            .then(res => {
                if (res.ok) {
                    alert("🗑️ Presença removida com sucesso!");
                    puxarRelatorioNuvem();
                } else {
                    alert("❌ Não foi possível excluir.");
                }
            })
            .catch(err => {
                console.error(err);
                alert("❌ Erro de conexão ao tentar excluir.");
            });
        }
    }
</script>
</body>
</html>
